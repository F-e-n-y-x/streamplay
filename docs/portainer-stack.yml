# ─────────────────────────────────────────────────────────────────────────────
# StreamPlay — Portainer Stack
#
# How to use in Portainer:
#   1. Portainer → Stacks → "Add stack" → give it a name (e.g. streamplay).
#   2. Paste this whole file into the "Web editor".
#   3. Scroll to "Environment variables" and add:
#        TMDB_API_KEY = <your TMDB v3 key>   (required)
#        WYZIE_KEY    = <optional, blank ok>
#   4. Click "Deploy the stack".
#   5. Open http://<your-server-ip>:3000
#
# Updating: re-pull `:1` (all 1.x releases) and redeploy, or pin e.g. `:1.3.1`.
# Upgrading from a pre-non-root image: see docs/DEPLOY.md (one-time volume chown).
# ─────────────────────────────────────────────────────────────────────────────
services:
  streamplay:
    image: ghcr.io/f-e-n-y-x/streamplay:1   # major tag: gets 1.x fixes; pin e.g. :1.3.1 for fully fixed
    container_name: streamplay
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}
      FLARESOLVERR_URL: http://flaresolverr:8191/
      WYZIE_KEY: ${WYZIE_KEY:-}
      PROVIDER_TIMEOUT_MS: "45000"
      SYNC_DATA_FILE: /app/data/sync-data.json
      # Optional hardening (blank/unset = defaults):
      # shared secret required by the API/UI when set
      # Set behind a reverse proxy so rate limits see real client IPs (e.g. 1).
      TRUST_PROXY: ${TRUST_PROXY:-}
      STREAMPLAY_PASSWORD: ${STREAMPLAY_PASSWORD:-}
      # max concurrent torrents (default 5)
      TORRENT_MAX_ACTIVE: ${TORRENT_MAX_ACTIVE:-}
      # sync-code probe rate limit per minute (default 60)
      SYNC_PROBE_PER_MIN: ${SYNC_PROBE_PER_MIN:-}
      # Addons: comma-separated manifest URLs (Nuvio plugins run as code — only trusted repos)
      NUVIO_PLUGINS: ${NUVIO_PLUGINS:-}
      STREMIO_ADDONS: ${STREMIO_ADDONS:-}
      # required to manage Torznab/addons from the UI (X-Admin-Token)
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - streamplay-data:/app/data
    depends_on:
      flaresolverr:
        condition: service_healthy

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: UTC
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  streamplay-data:
