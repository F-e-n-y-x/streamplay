services:
  streamplay:
    image: ghcr.io/f-e-n-y-x/streamplay:1   # major tag: gets 1.x fixes; pin e.g. :1.3.1 for fully fixed
    # To build from source instead of pulling the published image, comment out
    # the `image:` line above and uncomment the next line:
    # build: .
    container_name: streamplay
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:?set TMDB_API_KEY in your .env}
      FLARESOLVERR_URL: http://flaresolverr:8191/
      WYZIE_KEY: ${WYZIE_KEY:-}
      # TheTVDB — better cartoon (production/DVD order) + Indian/international series
      # data. Free key at thetvdb.com → Dashboard → API. See .env.example.
      TVDB_API_KEY: ${TVDB_API_KEY:-}
      TVDB_PIN: ${TVDB_PIN:-}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-45000}
      SYNC_DATA_FILE: /app/data/sync-data.json
      # Optional hardening (blank/unset = defaults):
      # shared secret required by the API/UI when set
      # Set behind a reverse proxy so rate limits see real client IPs (e.g. 1).
      TRUST_PROXY: ${TRUST_PROXY:-}
      STREAMPLAY_PASSWORD: ${STREAMPLAY_PASSWORD:-}
      # max concurrent torrents (default 5)
      TORRENT_MAX_ACTIVE: ${TORRENT_MAX_ACTIVE:-}
      # sync-code probe rate limit per minute (default 60)
      SYNC_PROBE_PER_MIN: ${SYNC_PROBE_PER_MIN:-}
      # DNS-over-HTTPS — set DOH_ENABLED=true in your .env if provider hosts fail
      # to resolve on your network (proxy 502s mentioning DNS). See .env.example.
      DOH_ENABLED: ${DOH_ENABLED:-false}
      DOH_PROVIDER: ${DOH_PROVIDER:-google}
      # Cloudflare WARP proxy (opt-in) — beat IP blocks / DNS poisoning. Uncomment
      # the `warp` + `flaresolverr-warp` services below, then set WARP_MODE in .env.
      WARP_MODE: ${WARP_MODE:-off}
      WARP_PROXY_URL: ${WARP_PROXY_URL:-}
      WARP_FLARESOLVERR_URL: ${WARP_FLARESOLVERR_URL:-}
      # Optional anime aggregator — uncomment the `consumet` service below to enable.
      CONSUMET_URL: ${CONSUMET_URL:-}
      # Addons (comma-separated manifest URLs; see .env.example — Nuvio plugins run as code, trust them):
      NUVIO_PLUGINS: ${NUVIO_PLUGINS:-}
      STREMIO_ADDONS: ${STREMIO_ADDONS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - streamplay-data:/app/data
    depends_on:
      flaresolverr:
        condition: service_healthy

  # Optional: self-hosted Consumet aggregator (Zoro/AnimePahe/Gogo/AnimeKai fallback).
  # NOTE (Jul 2026): most of its back-ends are currently down; enable when they revive.
  # Uncomment this service AND set CONSUMET_URL=http://consumet:3000 in your .env.
  # consumet:
  #   image: riimuru/consumet-api:latest
  #   container_name: consumet
  #   restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: UTC
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Uncomment to reach FlareSolverr directly from the host (not required):
    # ports:
    #   - "8191:8191"

  # ── OPTIONAL: Byparr — maintained FlareSolverr-API solver (Camoufox). Run it beside
  # FlareSolverr and add it to the pool: FLARESOLVERR_URL=http://flaresolverr:8191/,http://byparr:8191/
  # (no healthcheck dependency: its /health does a real solve).
  # byparr:
  #   image: ghcr.io/thephaseless/byparr:3.0.4
  #   container_name: byparr
  #   restart: unless-stopped
  #   shm_size: "1gb"
  #   tmpfs: ["/tmp:exec,mode=1777,size=1G"]
  #   environment: { TZ: UTC, BROWSER_LOCALE: en-US, BROWSER_TIMEZONE: UTC }

  # ── OPTIONAL: Cloudflare WARP proxy ──────────────────────────────────────────
  # Uncomment this whole block to give StreamPlay a clean Cloudflare WARP egress IP
  # (fixes AnimePahe/Kwik "your IP is banned", ISP DNS poisoning, geo-blocks). Then
  # in your .env set WARP_MODE (off|required|fallback|all) and (both via the `warp`
  # container, since flaresolverr-warp shares warp's network namespace):
  #   WARP_PROXY_URL=socks5://warp:1080
  #   WARP_FLARESOLVERR_URL=http://warp:8191/
  #
  # warp:
  #   image: caomingjun/warp:latest        # https://github.com/cmj2002/warp-docker
  #   container_name: warp
  #   restart: unless-stopped
  #   environment:
  #     WARP_SLEEP: 2
  #   cap_add:
  #     - MKNOD
  #     - AUDIT_WRITE
  #     - NET_ADMIN
  #   sysctls:
  #     - net.ipv6.conf.all.disable_ipv6=0
  #     - net.ipv4.conf.all.src_valid_mark=1
  #   volumes:
  #     - warp-data:/var/lib/cloudflare-warp
  #
  # A SECOND FlareSolverr whose browser egresses THROUGH warp (shares warp's network
  # namespace). This is the instance that solves Kwik with the clean IP. Because it
  # shares warp's netns, other services reach it at http://warp:8191/ (NOT
  # flaresolverr-warp). warp must therefore not also bind 8191 elsewhere.
  # flaresolverr-warp:
  #   image: ghcr.io/flaresolverr/flaresolverr:latest
  #   container_name: flaresolverr-warp
  #   restart: unless-stopped
  #   network_mode: service:warp
  #   environment:
  #     LOG_LEVEL: info
  #     TZ: UTC
  #   depends_on:
  #     - warp

volumes:
  streamplay-data:
  # warp-data:
